name: Sync v0.1.6 source
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sync-v016.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact v0.1.6 source
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/app.zip
          rm -rf /tmp/appsrc && mkdir -p /tmp/appsrc
          unzip -q /tmp/app.zip -d /tmp/appsrc
          cp -a /tmp/appsrc/university-park-lions-mobile-v0.1.6/. ./
          rm -f .github/workflows/sync-v016.yml
          git config user.name 'Picklescoop'
          git config user.email 'picklescoop@gmail.com'
          git add -A
          git commit -m 'Release University Park Lions mobile v0.1.6'
          git push
